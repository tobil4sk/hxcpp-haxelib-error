on:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: krdlab/setup-haxe@v2
      with:
        haxe-version: 3.4.7

    - run: |
        haxelib install hxcpp 4.0.8 --quiet
        haxelib install haxelib 3.3.0 --quiet

    - run: |
        haxelib dev somelib $pwd\lib
        haxelib path somelib

    - run: haxe compile.hxml

